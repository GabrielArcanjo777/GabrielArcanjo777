<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Arcanjo</title>
  <desc id="desc">Banner de perfil com estética de terminal Linux dark</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="0.55" stop-color="#0b1120" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#60a5fa" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b82f6" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)" />
  <rect width="1200" height="300" rx="24" fill="url(#grid)" />

  <g transform="translate(52 42)">
    <rect width="1096" height="216" rx="15" fill="#020617" fill-opacity="0.85" stroke="#1e40af" stroke-width="1" />
    <circle cx="24" cy="23" r="6" fill="#dc2626" />
    <circle cx="45" cy="23" r="6" fill="#ca8a04" />
    <circle cx="66" cy="23" r="6" fill="#16a34a" />
    <text x="42" y="93" fill="#16a34a" font-family="Consolas, 'Courier New', monospace" font-size="20">$ whoami</text>
    <text x="42" y="145" fill="#60a5fa" filter="url(#glow)" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="3">GABRIEL ARCANJO</text>
    <text x="44" y="185" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="20">Linux • Cloud • Segurança • Redes • Infra</text>
    <text x="44" y="210" fill="#64748b" font-family="Consolas, 'Courier New', monospace" font-size="15">Formado no IFRJ  |  Infnet  |  Rio de Janeiro, Brasil</text>
  </g>
</svg>