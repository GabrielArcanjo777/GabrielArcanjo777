<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Arcanjo</title>
  <desc id="desc">Banner de perfil — terminal dark com nome em gradiente</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02040a" />
      <stop offset="0.6" stop-color="#060b16" />
      <stop offset="1" stop-color="#0a1322" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.55" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.14" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#3b82f6" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="320" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <circle cx="140" cy="20" r="320" fill="url(#glowCyan)" />
    <circle cx="1080" cy="310" r="340" fill="url(#glowViolet)" />
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#16233b" stroke-width="1" />

  <!-- janela do terminal -->
  <g transform="translate(70 36)">
    <rect width="1060" height="248" rx="14" fill="#05080f" fill-opacity="0.92" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1" />
    <line x1="1" y1="40" x2="1059" y2="40" stroke="#101a2c" stroke-width="1" />
    <circle cx="26" cy="20" r="6" fill="#f87171" />
    <circle cx="48" cy="20" r="6" fill="#fbbf24" />
    <circle cx="70" cy="20" r="6" fill="#34d399" />
    <text x="530" y="25" text-anchor="middle" fill="#4b5a75" font-family="Consolas, 'Courier New', monospace" font-size="13">gabriel@arcanjo: ~</text>

    <text x="40" y="86" fill="#34d399" font-family="Consolas, 'Courier New', monospace" font-size="19">$ whoami</text>
    <rect x="140" y="71" width="10" height="19" fill="#34d399">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.4s" repeatCount="indefinite" />
    </rect>

    <text x="38" y="150" fill="url(#nameGrad)" filter="url(#softGlow)" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="3">GABRIEL ARCANJO</text>
    <rect x="41" y="166" width="430" height="3" rx="1.5" fill="url(#accent)" />

    <text x="40" y="202" fill="#93a4c3" font-family="'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="1">Linux&#160;&#160;•&#160;&#160;Cloud&#160;&#160;•&#160;&#160;Segurança&#160;&#160;•&#160;&#160;Redes&#160;&#160;•&#160;&#160;Infra</text>
    <text x="40" y="231" fill="#54627d" font-family="Consolas, 'Courier New', monospace" font-size="15">Engenharia da Computação @ Infnet&#160;&#160;|&#160;&#160;Téc. Informática para Internet @ IFRJ&#160;&#160;|&#160;&#160;Rio de Janeiro, BR</text>
  </g>
</svg>
