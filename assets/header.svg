<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Arcanjo</title>
  <desc id="desc">Banner de perfil com estética de terminal Linux</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d" />
      <stop offset="0.55" stop-color="#0d1424" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" />
      <stop offset="0.5" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)" />
  <rect width="1200" height="300" rx="24" fill="url(#grid)" />
  <path d="M0 245C170 190 265 292 445 239S780 172 1200 238V300H0Z" fill="#8b5cf6" fill-opacity="0.08" />
  <path d="M0 258C210 205 330 292 530 250S870 203 1200 255" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2" />

  <g transform="translate(52 42)">
    <rect width="1096" height="216" rx="15" fill="#030712" fill-opacity="0.76" stroke="#334155" />
    <circle cx="24" cy="23" r="6" fill="#ef4444" />
    <circle cx="45" cy="23" r="6" fill="#f59e0b" />
    <circle cx="66" cy="23" r="6" fill="#22c55e" />
    <text x="548" y="28" text-anchor="middle" fill="#64748b" font-family="Consolas, 'Courier New', monospace" font-size="14">gabriel@kali: ~/github</text>

    <text x="42" y="83" fill="#22c55e" font-family="Consolas, 'Courier New', monospace" font-size="20">$ whoami</text>
    <text x="42" y="132" fill="url(#accent)" filter="url(#glow)" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="2">GABRIEL ARCANJO</text>
    <text x="44" y="171" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Engenharia da Computação • Linux • Cloud • Segurança</text>
    <text x="44" y="199" fill="#64748b" font-family="Consolas, 'Courier New', monospace" font-size="15">Formado no IFRJ  |  Estudante no Instituto Infnet  |  Rio de Janeiro, Brasil</text>

    <rect x="1028" y="176" width="12" height="23" fill="#22c55e" opacity="0.9" />
  </g>
</svg>
