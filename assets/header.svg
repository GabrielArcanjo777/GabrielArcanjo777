<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Arcanjo</title>
  <desc id="desc">Cartão de terminal dark com o nome em destaque e o octocat do GitHub</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02040a" />
      <stop offset="0.6" stop-color="#060b16" />
      <stop offset="1" stop-color="#0a1322" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9a8d4" />
      <stop offset="0.5" stop-color="#ec4899" />
      <stop offset="1" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="octoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6" />
      <stop offset="1" stop-color="#d946ef" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.16" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#3b82f6" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="octoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="360" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <circle cx="150" cy="30" r="340" fill="url(#glowCyan)" />
    <circle cx="1040" cy="340" r="360" fill="url(#glowViolet)" />
  </g>

  <!-- moldura + cantoneiras -->
  <rect x="10" y="10" width="1180" height="340" rx="18" fill="#05080f" fill-opacity="0.55" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1" />
  <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
    <path d="M38 66 L38 38 L66 38" />
    <path d="M1162 66 L1162 38 L1134 38" />
    <path d="M38 294 L38 322 L66 322" />
    <path d="M1134 322 L1162 322 L1162 294" />
  </g>

  <!-- octocat -->
  <g transform="translate(915 66) scale(10.5)" filter="url(#octoGlow)">
    <path fill="url(#octoGrad)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
  </g>

  <!-- conteúdo -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="72" y="90" fill="#34d399" font-size="18">&gt; Welcome to GitHub</text>
  </g>

  <text x="70" y="156" fill="url(#nameGrad)" filter="url(#softGlow)" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="2">GABRIEL</text>
  <text x="70" y="214" fill="url(#nameGrad)" filter="url(#softGlow)" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="2">ARCANJO</text>

  <text x="72" y="250" fill="#8aa0c2" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="1">Eng. Computação · Linux · Cloud · Segurança · Redes</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="72" y="286" fill="#5f6f8a">// Transformando aprendizado em projetos práticos, automação e segurança.</text>
    <text x="72" y="312" fill="#94a3b8"><tspan fill="#f87171">●</tspan> Logged in as user: <tspan fill="#f472b6">GabrielArcanjo777</tspan></text>
    <text x="72" y="338" fill="#54627d">~/GabrielRepo <tspan fill="#d946ef">[⌘ main]</tspan></text>
    <rect x="266" y="326" width="9" height="16" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
